# RUSTSEC ignore list read by `cargo audit` (CI and `task audit`).
[advisories]
ignore = [
  # rsa 0.9: Marvin attack (timing side channel in RSA private-key
  # operations); no fixed upstream release exists. It is in the tree only
  # because age's `ssh` feature, which the helper needs for ssh-ed25519
  # recipients, depends on it unconditionally. The helper refuses ssh-rsa
  # participants and identities before age sees them, so no RSA key is ever
  # parsed into it and no RSA operation runs. Residual risk: none while that
  # check stands; drop this entry when age releases a fixed `rsa`.
  "RUSTSEC-2023-0071",
]
