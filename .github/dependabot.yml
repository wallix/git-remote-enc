# Weekly update PRs for the Cargo dependencies and the SHA-pinned actions. They
# go through the same quality gate as any PR; the Nix toolchain pins are
# refreshed by ./update.sh instead.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
